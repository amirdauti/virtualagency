name: Server NPM Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "apps/server/**"
      - ".github/workflows/server-npm-release.yml"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update npm
        run: npm install -g npm@11.9.0

      - name: Install package dependencies
        run: npm install

      - name: Build release binary
        run: cargo build --release

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Detect release tag
        id: release_tag
        run: |
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC)
        if: steps.release_tag.outputs.tag != ''
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" || true
          unset NPM_CONFIG_USERCONFIG NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public --provenance
