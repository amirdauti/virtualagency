name: Server NPM Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "apps/server/**"
      - "apps/shared/**"
      - ".github/workflows/server-npm-release.yml"

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node apps/server/bin/ensure-claude-cli.js --force
      - name: Replay the current CLI through the browser parser
        run: |
          cp "$HOME/.virtual-agency/claude-cli/compatibility-events.jsonl" apps/server/tests/fixtures/claude-2.1.283.jsonl
          pnpm --filter @virtual-agency/desktop exec tsc --noEmit
          node --test apps/desktop/src/lib/frontendAudit.test.cjs

  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: virtual-agency-server-linux-x64
            binary_path: target/release/virtual-agency-server
          - os: macos-14
            artifact_name: virtual-agency-server-macos-arm64
            binary_path: target/release/virtual-agency-server
          - os: windows-latest
            artifact_name: virtual-agency-server-windows-x64.exe
            binary_path: target/release/virtual-agency-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test safe CLI upgrade fallback
        run: node --test apps/server/tests/claude-updater.test.cjs

      - name: Verify latest Claude CLI protocol before release
        run: node apps/server/bin/ensure-claude-cli.js --force

      - name: Use current CLI events in Telegram regression tests
        run: node -e "require('fs').copyFileSync(require('path').join(require('os').homedir(), '.virtual-agency/claude-cli/compatibility-events.jsonl'), 'apps/server/tests/fixtures/claude-2.1.283.jsonl')"

      - name: Build release binary
        run: cargo build --release -p virtual-agency-server

      - name: Test agent runtime and Telegram control
        run: cargo test -p virtual-agency-server

      - name: Test isolated control plane
        if: runner.os == 'Linux'
        run: python3 apps/server/tests/control_plane_smoke.py target/release/virtual-agency-server

      - name: Test DeepSeek isolation and persisted settings
        if: runner.os == 'Linux'
        run: python3 apps/server/tests/deepseek_smoke.py target/release/virtual-agency-server

      - name: Stage binary artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary_path }}" "out/${{ matrix.artifact_name }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "out/${{ matrix.artifact_name }}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    needs: [build-binaries, test-web]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
          package-manager-cache: false

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: virtual-agency-server-*
          path: apps/server/dist
          merge-multiple: true

      - name: Verify downloaded binaries
        run: ls -lah dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update npm
        run: npm install -g npm@11.9.0

      - name: Install package dependencies
        run: npm install

      - name: Build release binary
        run: cargo build --release

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Detect release tag
        id: release_tag
        run: |
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC)
        if: steps.release_tag.outputs.tag != ''
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" || true
          unset NPM_CONFIG_USERCONFIG NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public --provenance
