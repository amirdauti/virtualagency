<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Gradient for the 3D floor/platform -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#3b82f6" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    
    <!-- Background radial gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1e1e3f"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle outer glow -->
  <rect x="4" y="4" width="112" height="112" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- 3D Isometric Platform -->
  <g transform="translate(60, 70)">
    <!-- Main platform -->
    <polygon points="-40,20 0,-5 40,20 0,45" fill="url(#floorGrad)" stroke="#3b82f6" stroke-width="0.5"/>
    <polygon points="-40,20 0,-5 40,20 0,45" fill="url(#grid)"/>
    
    <!-- Platform glow edges -->
    <line x1="-40" y1="20" x2="0" y2="45" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="45" x2="40" y2="20" stroke="url(#accentGrad)" stroke-width="2" opacity="0.7"/>
    
    <!-- Agent 1 - Yellow (center front) -->
    <g transform="translate(0, 18)" filter="url(#glowEffect)">
      <ellipse cx="0" cy="10" rx="8" ry="4" fill="#fbbf24" opacity="0.3"/>
      <rect x="-7" y="-10" width="14" height="18" rx="4" fill="#fbbf24"/>
      <circle cx="0" cy="-18" r="9" fill="#fde68a"/>
      <circle cx="-3" cy="-19" r="2" fill="#1a1a2e"/>
      <circle cx="3" cy="-19" r="2" fill="#1a1a2e"/>
      <!-- AI antenna -->
      <line x1="0" y1="-27" x2="0" y2="-33" stroke="#00d4ff" stroke-width="2"/>
      <circle cx="0" cy="-35" r="3" fill="#00d4ff">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Agent 2 - Cyan (back left) -->
    <g transform="translate(-22, 0)" filter="url(#glowEffect)">
      <ellipse cx="0" cy="7" rx="5" ry="2.5" fill="#06b6d4" opacity="0.3"/>
      <rect x="-5" y="-7" width="10" height="13" rx="3" fill="#06b6d4"/>
      <circle cx="0" cy="-14" r="7" fill="#67e8f9"/>
      <circle cx="-2.5" cy="-15" r="1.5" fill="#1a1a2e"/>
      <circle cx="2.5" cy="-15" r="1.5" fill="#1a1a2e"/>
      <line x1="0" y1="-21" x2="0" y2="-26" stroke="#f472b6" stroke-width="1.5"/>
      <circle cx="0" cy="-28" r="2.5" fill="#f472b6">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Agent 3 - Purple (back right) -->
    <g transform="translate(22, 0)" filter="url(#glowEffect)">
      <ellipse cx="0" cy="7" rx="5" ry="2.5" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-5" y="-7" width="10" height="13" rx="3" fill="#8b5cf6"/>
      <circle cx="0" cy="-14" r="7" fill="#c4b5fd"/>
      <circle cx="-2.5" cy="-15" r="1.5" fill="#1a1a2e"/>
      <circle cx="2.5" cy="-15" r="1.5" fill="#1a1a2e"/>
      <line x1="0" y1="-21" x2="0" y2="-26" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="0" cy="-28" r="2.5" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Connection lines -->
    <line x1="-18" y1="-10" x2="-5" y2="0" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;6" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="18" y1="-10" x2="5" y2="0" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;6" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Floating particles -->
  <circle cx="20" cy="25" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="cy" values="25;20;25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="30" r="1.5" fill="#f472b6" opacity="0.5">
    <animate attributeName="cy" values="30;25;30" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="95" r="1.5" fill="#7c3aed" opacity="0.4">
    <animate attributeName="cy" values="95;90;95" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="90" r="1" fill="#22d3ee" opacity="0.5">
    <animate attributeName="cy" values="90;85;90" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
